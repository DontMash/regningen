name: Setup
description: Install the pinned Node/pnpm toolchain with frozen dependencies (run after actions/checkout)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: 26.8.1
        cache: pnpm
    - name: Install frozen dependencies (online setup only)
      shell: bash
      run: pnpm install --frozen-lockfile
